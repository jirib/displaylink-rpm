name: Create Release Assets

on:
  workflow_dispatch:
  release:
    types:
      - published
      - edited

jobs:
  build-srpm:
    runs-on: ubuntu-latest
    container:
      image: quay.io/rockylinux/rockylinux:9
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        run: echo "VERSION=$(sed -n 's/^VERSION[[:space:]]*:=[[:space:]]*//p' Makefile)" >> $GITHUB_ENV

      - name: Get release
        run: echo "RELEASE=$(sed -n 's/^RELEASE[[:space:]]*:=[[:space:]]*//p' Makefile)" >> $GITHUB_ENV

      - name: Set environment variables
        run: echo "SPECIFICTARGET=srpm-github" >> $GITHUB_ENV

      - name: Build SRPM
        run: ci/rocky.sh

      - name: Upload SRPM to release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: 'displaylink-${{ env.VERSION }}-${{ env.RELEASE }}*.src.rpm'
          draft: false
          update_latest_release: true
          tags: true
          overwrite: true

  buildrpms-x86-64:
    uses: ./.github/workflows/build-matrix.yml
    with:
      runs-on: ubuntu-latest
      arch: x86_64
      specifictarget: rpm-github
      upload: true
      upload-release: ${{ github.event_name == 'release' }}
    secrets: inherit

  buildrpms-arm:
    uses: ./.github/workflows/build-matrix.yml
    with:
      runs-on: ubuntu-24.04-arm
      arch: aarch64
      specifictarget: rpm-github
      upload: true
      upload-release: ${{ github.event_name == 'release' }}
    secrets: inherit

  create-repositories:
    name: Publish RPM repositories
    needs: [buildrpms-x86-64, buildrpms-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built RPMs
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Install repository and signing tools
        run: sudo apt-get update && sudo apt-get install -y createrepo-c gnupg rpm

      - name: Build RPM repositories and sign
        run: bash ci/create-repos.sh artifacts public "${{ github.repository }}"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
